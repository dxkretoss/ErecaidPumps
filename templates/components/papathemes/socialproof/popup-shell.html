{{!-- Papathemes Social Proof — Popup Manager shell.
      Exit-intent and promo popups attach their modal DOM dynamically.
      This empty div only carries the localized strings so that the popup
      builders can read them via dataset without re-fetching language files. --}}
<div class="papathemes-socialproof-popup-host"
     data-papathemes-popup-host
     data-lang-close="{{lang 'socialproof.popup.close'}}"
     data-lang-copy-code="{{lang 'socialproof.popup.copy_code'}}"
     data-lang-copied="{{lang 'socialproof.popup.copied'}}"
     data-lang-no-thanks="{{lang 'socialproof.popup.no_thanks'}}"
     data-lang-redirecting-in="{{lang 'socialproof.popup.redirecting_in'}}">
</div>
