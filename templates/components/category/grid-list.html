<fieldset class="form-fieldset actionBar-section actionBar-section--mode">
    <div class="form-field actionBar-modeToggle">
        <input class="form-radio is-srOnly" type="radio" name="mode" value="3" id="mode_3{{id_suffix}}" checked>
        <label class="form-option actionBar-modeBtn actionBar-modeBtn--grid" for="mode_3{{id_suffix}}" title="Grid View" aria-label="Grid View">
            <svg class="actionBar-modeIcon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                <rect x="1" y="1" width="7" height="7" rx="1.8"></rect>
                <rect x="10" y="1" width="7" height="7" rx="1.8"></rect>
                <rect x="1" y="10" width="7" height="7" rx="1.8"></rect>
                <rect x="10" y="10" width="7" height="7" rx="1.8"></rect>
            </svg>
        </label>

        <input class="form-radio is-srOnly" type="radio" name="mode" value="1" id="mode_1{{id_suffix}}">
        <label class="form-option actionBar-modeBtn actionBar-modeBtn--list" for="mode_1{{id_suffix}}" title="List View" aria-label="List View">
            <svg class="actionBar-modeIcon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor">
                <circle cx="2.5" cy="4" r="1.5" fill="currentColor"></circle>
                <line x1="6.5" y1="4" x2="16.5" y2="4" stroke-width="2" stroke-linecap="round"></line>
                <circle cx="2.5" cy="9" r="1.5" fill="currentColor"></circle>
                <line x1="6.5" y1="9" x2="16.5" y2="9" stroke-width="2" stroke-linecap="round"></line>
                <circle cx="2.5" cy="14" r="1.5" fill="currentColor"></circle>
                <line x1="6.5" y1="14" x2="16.5" y2="14" stroke-width="2" stroke-linecap="round"></line>
            </svg>
        </label>
    </div>
</fieldset>
